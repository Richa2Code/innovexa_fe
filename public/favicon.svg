<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b3d91" />
      <stop offset="100%" stop-color="#001845" />
    </radialGradient>
    
    <!-- Gold Metallic Gradient for Emblem -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <!-- Blue Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>

    <!-- Tricolor Ribbon Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6806" />
    </linearGradient>
  </defs>

  <!-- Base Roundel Canvas -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Ashoka Chakra Base Emblem Motif -->
  <g transform="translate(180, 150) scale(1.3)" fill="url(#goldGrad)">
    <!-- Ashoka Lion Emblem Silhouette -->
    <path d="M 50 10 C 40 10, 35 20, 35 30 C 30 32, 20 38, 20 50 C 20 62, 28 70, 32 75 L 32 90 L 68 90 L 68 75 C 72 70, 80 62, 80 50 C 80 38, 70 32, 65 30 C 65 20, 60 10, 50 10 Z" />
    <!-- Chakra Wheel Base -->
    <rect x="25" y="92" width="50" height="14" rx="4" fill="url(#goldGrad)" />
    <circle cx="50" cy="99" r="5" fill="#001845" />
    <!-- Pillar Stand -->
    <path d="M 30 108 L 70 108 L 65 125 L 35 125 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Upward Growth Financial Arrow Motif -->
  <path d="M 120 360 C 200 360, 320 310, 380 180" fill="none" stroke="url(#arrowGrad)" stroke-width="32" stroke-linecap="round" />
  <path d="M 380 180 L 330 190 L 390 130 L 410 210 Z" fill="#00D2FF" />

  <!-- Subsidized Indian Flag Tricolor Ribbon Curve -->
  <!-- Saffron Layer -->
  <path d="M 100 375 C 180 375, 290 325, 345 220" fill="none" stroke="url(#saffronGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- White Layer -->
  <path d="M 90 388 C 170 388, 280 338, 335 233" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  <!-- Green Layer -->
  <path d="M 80 401 C 160 401, 270 351, 325 246" fill="none" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />
</svg>